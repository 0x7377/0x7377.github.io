intro:
  - >-
    I am a cybersecurity researcher at the [Ministry of National Defense, Republic of Korea](https://www.mnd.go.kr),
    where I have worked on cyber operations, incident response, and digital forensics since 2015.
    I am currently on secondment as a security analyst at a national agency.
    I received my M.S. in Computer Science from the [University of Colorado Boulder](https://www.colorado.edu),
    where I worked with Prof. Sangtae Ha, and my B.S. in Electronic Engineering from the
    [Korea Military Academy](https://www.kma.ac.kr).
  - >-
    My interests lie at the intersection of security and AI. I have worked on both sides of this area,
    from hands-on security operations to machine learning research, and I am particularly interested
    in AI systems that can support and automate real-world security work.

